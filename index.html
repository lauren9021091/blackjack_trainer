<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrategia Básica de Blackjack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Estrategia Básica de Blackjack</h1>
      <p>Selecciona una acción, pinta casillas individuales o haz clic en un encabezado para pintar filas o columnas completas.</p>
    </header>

    <!-- Controles de Paleta -->
    <section class="palette">
      <button class="palette-btn active" data-action="H" style="--btn-color: #34C759;">
        Pedir (H)
      </button>
      <button class="palette-btn" data-action="S" style="--btn-color: #FF3B30;">
        Plantarse (S)
      </button>
      <button class="palette-btn" data-action="D" style="--btn-color: #30B0C7;">
        Doblar (D)
      </button>
      <button class="palette-btn" data-action="SP" style="--btn-color: #FFCC00;">
        Dividir (SP)
      </button>
    </section>

    <!-- Pestañas de Tablas -->
    <nav class="tabs-nav">
      <button class="tab-btn active" data-tab="hard">Hard Totals</button>
      <button class="tab-btn" data-tab="soft">Soft Totals</button>
      <button class="tab-btn" data-tab="pairs">Pairs</button>
    </nav>

    <!-- Tablas -->
    <main class="tabs-content">
      <div id="tab-hard" class="tab-pane active"></div>
      <div id="tab-soft" class="tab-pane"></div>
      <div id="tab-pairs" class="tab-pane"></div>
    </main>

    <!-- Panel de Resultados y Acciones -->
    <footer class="controls-panel">
      <div class="actions">
        <button id="check-btn" class="action-btn primary">Revisar</button>
        <button id="clear-btn" class="action-btn secondary">Limpiar</button>
      </div>
      <div class="status-box">
        <div id="result-status">SIN REVISAR</div>
        <div id="score-details">Completa las casillas y presiona revisar</div>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
