<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Strategy Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>BLACKJACK STRATEGY TRAINER</h1>
      <p>Selecciona una acción y arrastra el cursor sobre la tabla para practicar</p>
    </header>

    <div class="main-layout">
      <!-- Columna Izquierda: Pestañas, Tablas y Botones -->
      <div class="table-section">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('hard')">Hard Totals</button>
          <button class="tab-btn" onclick="switchTab('soft')">Soft Totals</button>
          <button class="tab-btn" onclick="switchTab('pairs')">Pairs</button>
        </div>

        <div id="tab-hard" class="tab-content active"></div>
        <div id="tab-soft" class="tab-content"></div>
        <div id="tab-pairs" class="tab-content"></div>

        <div class="action-buttons">
          <button id="check-btn" onclick="checkAnswers()">🔍 Revisar Respuestas</button>
          <button id="clear-btn" onclick="clearTables()">🗑️ Limpiar Tablas</button>
        </div>

        <div class="results">
          <div id="result-status">SIN REVISAR</div>
          <div id="score-details">Completa las casillas y presiona revisar</div>
        </div>
      </div>

      <!-- Columna Derecha: Paleta de Acciones -->
      <div class="palette-section">
        <h2>ACCIONES</h2>
        <div class="palette-buttons">
          <button class="palette-btn active" data-action="H" onclick="setAction('H')">H — Pedir (Hit)</button>
          <button class="palette-btn" data-action="S" onclick="setAction('S')">S — Plantarse (Stand)</button>
          <button class="palette-btn" data-action="D" onclick="setAction('D')">D — Doblar (Double)</button>
          <button class="palette-btn" data-action="SP" onclick="setAction('SP')">SP — Separar (Split)</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
